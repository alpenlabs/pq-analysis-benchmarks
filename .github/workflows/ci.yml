name: ci

on:
  push:
  pull_request:

jobs:
  risc0:
    runs-on: ubuntu-latest
    env:
      # Skip the guest build: `size` only reads the committed receipt.
      RISC0_SKIP_BUILD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: risc0
      - name: size
        working-directory: risc0
        run: |
          cargo run --release -p host -- size | tee size.txt
          grep -q '^  222668  seal (u32 words \* 4)$' size.txt
