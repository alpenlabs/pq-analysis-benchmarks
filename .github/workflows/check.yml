# Re-derives the committed results from the committed artifacts. Proving is
# not run here: it needs the zkVM prover toolchains.

name: check

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RISC0_SKIP_BUILD: 1
  SP1_SKIP_PROGRAM_BUILD: true

# The repository is private, so checkout needs contents: read.
permissions:
  contents: read

jobs:
  risc0:
    name: Risc0 receipt
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          workspaces: risc0

      - name: Apply risc0-core patch
        run: ./risc0/patch.sh

      - name: size
        working-directory: risc0
        run: |
          for g in trivial fib journal; do
            cargo run --release --locked -p host -- size "$g" "size-$g.json" | tee "size-$g.txt"
            grep -q '^  222668  seal (u32 words \* 4)$' "size-$g.txt"
            diff "size-$g.json" ../results/risc0/size.json
          done

      - name: count
        working-directory: risc0
        run: |
          for g in trivial fib journal; do
            cargo run --release --locked -p host -- count "$g" "count-$g.json"
            diff "count-$g.json" ../results/risc0/ops.json
          done

      - name: params
        working-directory: risc0
        run: |
          for g in trivial fib journal; do
            cargo run --release --locked -p host -- params "$g" "params-$g.json"
            diff "params-$g.json" ../results/risc0/params.json
          done
      
  sp1:
    name: SP1 compressed proof
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          workspaces: sp1

      - name: Install protoc (sp1-prover-types build script)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - name: Apply Plonky3 patches
        run: ./sp1/patch.sh

      - name: size
        working-directory: sp1
        run: |
          for g in trivial fib journal; do
            cargo run --release --locked -- size "$g" "size-$g.json" | tee "size-$g.txt"
            grep -q '^ 1272546  proof total (incl. enum tag)$' "size-$g.txt"
            diff "size-$g.json" ../results/sp1/size.json
          done

      - name: count
        working-directory: sp1
        run: |
          for g in trivial fib journal; do
            cargo run --release --locked -- count "$g" "count-$g.json"
            diff "count-$g.json" ../results/sp1/ops.json
          done

      - name: params
        working-directory: sp1
        run: |
          for g in trivial fib journal; do
            cargo run --release --locked -- params "$g" "params-$g.json"
            diff "params-$g.json" ../results/sp1/params.json
          done

  stwo:
    name: Stwo proof
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        working-directory: stwo
        run: rustup show active-toolchain

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          workspaces: stwo

      - name: size
        working-directory: stwo
        env:
          RUST_MIN_STACK: 8388608
        run: |
          for g in trivial fib journal; do
            cargo run --release --locked -- size "$g" | tee "size-$g.txt"
            grep -q '^verified$' "size-$g.txt"
          done
          grep -q '^  546656  intrinsic total (size_estimate)$' size-trivial.txt
          grep -q '^  616528  intrinsic total (size_estimate)$' size-fib.txt
          grep -q '^  579224  intrinsic total (size_estimate)$' size-journal.txt
          for g in trivial fib journal; do
            cargo run --release --locked -- size "$g.leaf" "size-$g.json" | tee "size-$g-leaf.txt"
            grep -q '^verified$' "size-$g-leaf.txt"
            grep -q '^  545896  leaf circuit proof (serialized)$' "size-$g-leaf.txt"
            diff "size-$g.json" ../results/stwo/size.json
          done

      - name: count
        working-directory: stwo
        env:
          RUST_MIN_STACK: 8388608
        run: |
          for g in trivial fib journal; do
            cargo run --release --locked -- count "$g" "count-$g.json"
            diff "count-$g.json" ../results/stwo/ops.json
          done

      - name: params
        working-directory: stwo
        env:
          RUST_MIN_STACK: 8388608
        run: |
          for g in trivial fib journal; do
            cargo run --release --locked -- params "$g" "params-$g.json"
            diff "params-$g.json" ../results/stwo/params.json
          done

  gadgets:
    name: Gate costs (g16ckt)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        working-directory: gadgets
        run: rustup show active-toolchain

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          workspaces: gadgets

      - name: gadgets
        working-directory: gadgets
        run: |
          cargo run --release --locked -- gadgets.json
          diff gadgets.json ../results/gadgets.json

  gates:
    name: Gate estimate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: gates
        run: |
          python3 gates.py
          git diff --exit-code results/gates.json README.md

  check-success:
    name: Check that checks passed
    runs-on: ubuntu-latest
    if: always()
    needs: [risc0, sp1, stwo, gadgets, gates]
    timeout-minutes: 30
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
