# Re-derives the committed results from the committed artifacts. Proving is
# not run here: it needs the zkVM prover toolchains.

name: check

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RISC0_SKIP_BUILD: 1
  SP1_SKIP_PROGRAM_BUILD: true

permissions: {}

jobs:
  risc0:
    name: Risc0 receipt
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          cache-on-failure: true
          workspaces: risc0

      - name: size
        working-directory: risc0
        run: |
          for g in trivial fib journal; do
            cargo run --release --locked -p host -- size "$g" | tee "size-$g.txt"
            grep -q '^  222668  seal (u32 words \* 4)$' "size-$g.txt"
          done

  sp1:
    name: SP1 compressed proof
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          cache-on-failure: true
          workspaces: sp1

      - name: size
        working-directory: sp1
        run: |
          for g in trivial fib journal; do
            cargo run --release --locked -- size "$g" | tee "size-$g.txt"
            grep -q '^ 1272546  proof total (incl. enum tag)$' "size-$g.txt"
          done

  stwo:
    name: Stwo proof
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        working-directory: stwo
        run: rustup show active-toolchain

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          cache-on-failure: true
          workspaces: stwo

      - name: size
        working-directory: stwo
        env:
          RUST_MIN_STACK: 8388608
        run: |
          for g in trivial fib journal; do
            cargo run --release --locked -- size "$g" | tee "size-$g.txt"
            grep -q '^verified$' "size-$g.txt"
          done
          grep -q '^  546656  intrinsic total (size_estimate)$' size-trivial.txt
          grep -q '^  616528  intrinsic total (size_estimate)$' size-fib.txt
          grep -q '^  579224  intrinsic total (size_estimate)$' size-journal.txt

  check-success:
    name: Check that checks passed
    runs-on: ubuntu-latest
    if: always()
    needs: [risc0, sp1, stwo]
    timeout-minutes: 30
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
