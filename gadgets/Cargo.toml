[package]
name = "gadgets"
version = "0.1.0"
edition = "2024"

[dependencies]
blake2 = "0.10"
blake3 = "1"
g16ckt = { git = "https://github.com/alpenlabs/g16", rev = "f78c01da1ec9138b6c3a1c872405c1eefbaca48e" }
num-bigint = "0.4"
p3-field = "=0.4.3-succinct"
p3-symmetric = "=0.4.3-succinct"
rand = "0.8"
rand_chacha = "0.3"
risc0-zkp = { version = "=3.0.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slop-koala-bear = "=6.3.1"

[profile.release]
lto = true
