[package]
name = "script"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
bincode = "1.3"
p3-field = "=0.4.3-succinct"
serde = "1"
serde_json = "1"
sp1-hypercube = "=6.3.1"
sp1-primitives = "=6.3.1"
sp1-prover = "=6.3.1"
sp1-sdk = { version = "=6.3.1", features = ["blocking"] }
sp1-verifier = "=6.3.1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
sp1-build = "=6.3.1"
